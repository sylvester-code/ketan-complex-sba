<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#051329" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Ring with Laurels -->
  <circle cx="250" cy="230" r="200" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />
  <circle cx="250" cy="230" r="186" fill="none" stroke="#0f2942" stroke-width="3" stroke-dasharray="8 6" />

  <!-- School Name Curved Text -->
  <path id="textArcTop" d="M 85 230 A 165 165 0 0 1 415 230" fill="none" />
  <text font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" fill="#0f2942" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      KETAN M/A B COMPLEX
    </textPath>
  </text>

  <!-- Main Heraldic Shield -->
  <path d="M 160 145 L 340 145 C 340 260 250 310 250 330 C 250 310 160 260 160 145 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Shield Divider Lines -->
  <path d="M 250 145 L 250 325" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />
  <path d="M 162 225 L 338 225" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Quadrant 1 (Top-Left): Open Book -->
  <g transform="translate(180, 165) scale(0.075)" fill="url(#goldGrad)">
    <path d="M448 360V136c0-30.9-25.1-56-56-56H120c-30.9 0-56 25.1-56 56v224c0 30.9 25.1 56 56 56h272c30.9 0 56-25.1 56-56zm-72-232c13.3 0 24 10.7 24 24v176c0 13.3-10.7 24-24 24H144c-13.3 0-24-10.7-24-24V152c0-13.3 10.7-24 24-24h232z"/>
  </g>
  <!-- Simple Open Book Vector -->
  <g transform="translate(205, 185)">
    <path d="M -22 -12 Q -10 -15 0 -9 Q 10 -15 22 -12 L 22 15 Q 10 12 0 16 Q -10 12 -22 15 Z" fill="#ffffff" />
    <path d="M 0 -9 L 0 16" stroke="#0f2942" stroke-width="2" />
    <line x1="-18" y1="-5" x2="-4" y2="-3" stroke="#0f2942" stroke-width="1.5" />
    <line x1="-18" y1="2" x2="-4" y2="4" stroke="#0f2942" stroke-width="1.5" />
    <line x1="-18" y1="9" x2="-4" y2="11" stroke="#0f2942" stroke-width="1.5" />
    <line x1="4" y1="-3" x2="18" y2="-5" stroke="#0f2942" stroke-width="1.5" />
    <line x1="4" y1="4" x2="18" y2="2" stroke="#0f2942" stroke-width="1.5" />
    <line x1="4" y1="11" x2="18" y2="9" stroke="#0f2942" stroke-width="1.5" />
  </g>

  <!-- Quadrant 2 (Top-Right): Flaming Torch -->
  <g transform="translate(295, 185)">
    <path d="M -4 4 L 4 4 L 2 18 L -2 18 Z" fill="url(#goldGrad)" />
    <path d="M -6 4 L 6 4 L 8 -1 L -8 -1 Z" fill="#f8fafc" />
    <!-- Flame -->
    <path d="M 0 -18 Q -8 -8 0 0 Q 8 -8 0 -18 Z" fill="#ef4444" />
    <path d="M 0 -14 Q -4 -7 0 -2 Q 4 -7 0 -14 Z" fill="#fbbf24" />
  </g>

  <!-- Quadrant 3 & 4 (Lower Center): Graduation Cap & Golden Star -->
  <g transform="translate(250, 268)">
    <!-- Cap -->
    <polygon points="0,-14 26,-4 0,6 -26,-4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <path d="M -16 0 L -16 10 Q 0 16 16 10 L 16 0" fill="#d97706" />
    <!-- Tassel -->
    <path d="M 22 -3 L 26 12" stroke="#ffffff" stroke-width="2" />
    <circle cx="26" cy="13" r="2" fill="#ffffff" />
  </g>

  <!-- Golden Ribbon Banner at bottom -->
  <g filter="url(#shadow)">
    <!-- Ribbon ends -->
    <path d="M 70 415 L 110 390 L 110 435 Z" fill="#92400e" />
    <path d="M 430 415 L 390 390 L 390 435 Z" fill="#92400e" />
    <!-- Ribbon body -->
    <path d="M 90 410 Q 250 440 410 410 L 390 380 Q 250 405 110 380 Z" fill="url(#goldRibbon)" stroke="#78350f" stroke-width="2" />
    <!-- Motto Text on Ribbon -->
    <path id="mottoArc" d="M 95 408 Q 250 436 405 408" fill="none" />
    <text font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" fill="#0f2942" letter-spacing="2.5">
      <textPath href="#mottoArc" startOffset="50%" text-anchor="middle">
        KNOWLEDGE • DISCIPLINE • EXCELLENCE
      </textPath>
    </text>
  </g>

  <!-- Founded Badge -->
  <rect x="210" y="348" width="80" height="22" rx="11" fill="#0f2942" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="250" y="363" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    SEKONDI
  </text>
</svg>
